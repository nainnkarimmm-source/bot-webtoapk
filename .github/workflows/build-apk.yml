name: Build WebToApk

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "ID unik dari bot"
        required: true
        type: string

      app_name:
        description: "Nama app yang dipaparkan"
        required: true
        type: string

      package_name:
        description: "Package name, contoh com.webtoapp.myapp123"
        required: true
        type: string

      mode:
        description: "Mode: url atau html"
        required: true
        default: "url"
        type: choice
        options:
          - url
          - html

      target_url:
        description: "URL website jika mode=url"
        required: false
        default: ""
        type: string


jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT REPOSITORY
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # 2. JAVA 17
      # ==========================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # 3. ANDROID SDK
      # ==========================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-34 build-tools;34.0.0"


      # ==========================================
      # 4. SETUP GRADLE
      # ==========================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"


      # ==========================================
      # 5. SEMAK TOOL
      # ==========================================
      - name: Check Android and Gradle
        run: |
          echo "=== Java ==="
          java -version

          echo "=== Gradle ==="
          gradle --version

          echo "=== Android SDK ==="
          echo "$ANDROID_SDK_ROOT"

          echo "=== SDK Packages ==="
          sdkmanager --list_installed | head -100


      # ==========================================
      # 6. INJECT APP CONFIGURATION
      # ==========================================
      - name: Inject konfigurasi app
        shell: bash
        run: |
          set -e

          cd android-template

          APP_NAME="${{ github.event.inputs.app_name }}"
          PACKAGE_NAME="${{ github.event.inputs.package_name }}"
          MODE="${{ github.event.inputs.mode }}"
          TARGET_URL="${{ github.event.inputs.target_url }}"

          echo "App Name: $APP_NAME"
          echo "Package: $PACKAGE_NAME"
          echo "Mode: $MODE"
          echo "Target URL: $TARGET_URL"

          # --------------------------------------
          # Package name
          # --------------------------------------
          sed -i "s#__PACKAGE_NAME__#${PACKAGE_NAME}#g" \
            app/build.gradle

          # --------------------------------------
          # App name
          # --------------------------------------
          sed -i "s#__APP_NAME__#${APP_NAME}#g" \
            app/src/main/res/values/strings.xml

          # --------------------------------------
          # Mode
          # --------------------------------------
          sed -i "s#__WEBVIEW_MODE__#${MODE}#g" \
            app/src/main/res/values/strings.xml

          # --------------------------------------
          # URL / HTML
          # --------------------------------------
          if [ "$MODE" = "html" ]; then

            echo "HTML mode selected"

            sed -i "s#__WEBVIEW_TARGET__#index.html#g" \
              app/src/main/res/values/strings.xml

            mkdir -p app/src/main/assets

            HTML_SOURCE="../pending-builds/${{ github.event.inputs.build_id }}/index.html"

            if [ ! -f "$HTML_SOURCE" ]; then
              echo "ERROR: HTML file tidak dijumpai:"
              echo "$HTML_SOURCE"
              exit 1
            fi

            cp "$HTML_SOURCE" \
              app/src/main/assets/index.html

          else

            echo "URL mode selected"

            if [ -z "$TARGET_URL" ]; then
              echo "ERROR: target_url kosong untuk mode URL"
              exit 1
            fi

            sed -i "s#__WEBVIEW_TARGET__#${TARGET_URL}#g" \
              app/src/main/res/values/strings.xml

          fi

          echo "Configuration injection selesai."


      # ==========================================
      # 7. SHOW PROJECT
      # ==========================================
      - name: Check Android project
        run: |
          echo "=== Project files ==="
          find android-template -maxdepth 6 -type f | sort


      # ==========================================
      # 8. BUILD APK
      # ==========================================
      - name: Build APK
        run: |
          cd android-template

          echo "Building APK..."

          gradle assembleDebug --no-daemon --stacktrace


      # ==========================================
      # 9. CHECK APK
      # ==========================================
      - name: Check generated APK
        run: |
          echo "=== Generated APK ==="

          find android-template/app/build/outputs \
            -type f \
            -name "*.apk" \
            -print

          if ! find android-template/app/build/outputs \
            -type f \
            -name "*.apk" | grep -q ".apk"; then

            echo "ERROR: APK tidak berjaya dihasilkan."
            exit 1
          fi


      # ==========================================
      # 10. RENAME APK
      # ==========================================
      - name: Rename APK
        shell: bash
        run: |
          set -e

          mkdir -p out

          APK_FILE=$(find android-template/app/build/outputs \
            -type f \
            -name "*.apk" | head -1)

          APP_NAME="${{ github.event.inputs.app_name }}"
          BUILD_ID="${{ github.event.inputs.build_id }}"

          SAFE_APP_NAME=$(echo "$APP_NAME" | \
            tr ' ' '_' | \
            tr -cd '[:alnum:]_.-')

          OUTPUT="out/${SAFE_APP_NAME}-${BUILD_ID}.apk"

          cp "$APK_FILE" "$OUTPUT"

          echo "APK:"
          echo "$OUTPUT"

          ls -lh out/


      # ==========================================
      # 11. UPLOAD APK ARTIFACT
      # ==========================================
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.build_id }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 7
