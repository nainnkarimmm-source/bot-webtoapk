name: Build WebToApk

run-name: apk-${{ inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "ID unik dari bot"
        required: true
        type: string

      app_name:
        description: "Nama app"
        required: true
        type: string

      package_name:
        description: "Package name"
        required: true
        type: string

      mode:
        description: "url atau html"
        required: true
        default: "url"
        type: choice
        options:
          - url
          - html

      target_url:
        description: "URL website"
        required: false
        default: ""
        type: string


jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-34 build-tools;34.0.0"


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"


      - name: Check tools
        run: |
          echo "Java:"
          java -version

          echo "Gradle:"
          gradle --version

          echo "Android SDK:"
          echo "$ANDROID_SDK_ROOT"

          echo "SDK:"
          sdkmanager --list_installed | head -100


      - name: Configure app
        shell: bash
        run: |
          set -e

          cd android-template

          APP_NAME="${{ inputs.app_name }}"
          PACKAGE_NAME="${{ inputs.package_name }}"
          MODE="${{ inputs.mode }}"
          TARGET_URL="${{ inputs.target_url }}"

          echo "APP NAME: $APP_NAME"
          echo "PACKAGE: $PACKAGE_NAME"
          echo "MODE: $MODE"
          echo "URL: $TARGET_URL"

          sed -i "s#__PACKAGE_NAME__#${PACKAGE_NAME}#g" \
            app/build.gradle

          sed -i "s#__APP_NAME__#${APP_NAME}#g" \
            app/src/main/res/values/strings.xml

          sed -i "s#__WEBVIEW_MODE__#${MODE}#g" \
            app/src/main/res/values/strings.xml

          if [ "$MODE" = "html" ]; then

            echo "HTML MODE"

            sed -i "s#__WEBVIEW_TARGET__#index.html#g" \
              app/src/main/res/values/strings.xml

            mkdir -p app/src/main/assets

            HTML_FILE="../pending-builds/${{ inputs.build_id }}/index.html"

            if [ ! -f "$HTML_FILE" ]; then
              echo "ERROR: HTML file tidak dijumpai:"
              echo "$HTML_FILE"
              exit 1
            fi

            cp "$HTML_FILE" \
              app/src/main/assets/index.html

          else

            echo "URL MODE"

            if [ -z "$TARGET_URL" ]; then
              echo "ERROR: target_url kosong"
              exit 1
            fi

            sed -i "s#__WEBVIEW_TARGET__#${TARGET_URL}#g" \
              app/src/main/res/values/strings.xml

          fi


      - name: Generate Gradle Wrapper
        run: |
          cd android-template
          gradle wrapper \
            --gradle-version 8.7 \
            --distribution-type bin


      - name: Build APK
        run: |
          cd android-template

          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace


      - name: Check APK
        run: |
          echo "Checking APK..."

          find android-template/app/build/outputs \
            -type f \
            -name "*.apk" \
            -print

          if ! find android-template/app/build/outputs \
            -type f \
            -name "*.apk" | grep -q ".apk"; then
            echo "ERROR: APK tidak dijumpai"
            exit 1
          fi


      - name: Rename APK
        shell: bash
        run: |
          set -e

          mkdir -p out

          APK_FILE=$(find android-template/app/build/outputs \
            -type f \
            -name "*.apk" | head -1)

          APP_NAME="${{ inputs.app_name }}"
          BUILD_ID="${{ inputs.build_id }}"

          SAFE_NAME=$(echo "$APP_NAME" | \
            tr ' ' '_' | \
            tr -cd '[:alnum:]_.-')

          cp "$APK_FILE" \
            "out/${SAFE_NAME}-${BUILD_ID}.apk"

          ls -lh out/


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.build_id }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 7
